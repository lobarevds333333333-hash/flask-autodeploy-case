name: Build, Push & Deploy

# Запуск при push в main (плюс ручной запуск для проверки)
on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- Сборка Docker-образа и пуш в GitHub Container Registry ---
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Деплой на сервер через SSH ---
  # Шаг пропускается, если секреты SSH_HOST / SSH_USERNAME / SSH_KEY не заданы:
  # workflow при этом остаётся зелёным.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # secrets нельзя использовать прямо в if, поэтому прокидываем их через env
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Deploy to server via SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USERNAME != '' && env.SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"
            docker stop flask-autodeploy-case || true
            docker rm flask-autodeploy-case || true
            docker run -d --restart unless-stopped \
              --name flask-autodeploy-case \
              -p 8000:8000 \
              "$IMAGE"
            docker image prune -f
